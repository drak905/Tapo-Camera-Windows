[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-desktop"
version = "0.1.0"
description = "Native Windows desktop client for TP-Link Tapo cameras (local LAN: HTTPS, RTSP, ONVIF)"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.7", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-timeout>=2.3", "hypothesis>=6", "psutil>=5.9", "pyinstaller>=6.10"]

[project.scripts]
tapo-desktop = "tapo_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
timeout = 60
addopts = "-ra"
markers = [
  "unit: pure unit / property tests (Tier 1)",
  "integration: tests against the mock camera (Tier 2)",
  "chaos: fault-injection tests via ChaosProxy (Tier 2)",
  "soak: endurance / leak tests (Tier 3)",
  "hardware: live camera tests, need TAPO_HW_IP (Tier 4)",
  "ui: PyQt6 UI tests (Tier 4)",
]
qt_api = "pyqt6"
